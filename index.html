<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAS NO AQW</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cinzel para estilo RPG/Fantasy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        .font-rpg { font-family: 'Cinzel', serif; }
        .gold-border { border-color: rgba(234, 179, 8, 0.4); }
        .gold-glow:hover { box-shadow: 0 0 15px rgba(234, 179, 8, 0.25); }
        .purple-glow { box-shadow: 0 0 20px rgba(147, 51, 234, 0.15); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4 font-sans selection:bg-amber-500 selection:text-slate-950">

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-container" class="max-w-md mx-auto bg-slate-900/90 backdrop-blur p-8 rounded-2xl border gold-border shadow-2xl space-y-6 pt-16 mt-10 purple-glow">
        <h2 class="text-3xl font-extrabold text-center text-amber-400 font-rpg tracking-wider flex items-center justify-center gap-3">
            <i class="fa-solid fa-shield-halved text-amber-500"></i> METAS NO AQW
        </h2>
        <p class="text-xs text-slate-400 text-center uppercase tracking-widest border-b border-slate-800 pb-4">Acesse seu Grimório de Metas</p>
        
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="text-xs text-amber-200/80 font-semibold tracking-wider uppercase">E-mail</label>
                <input type="email" id="auth-email" required placeholder="seu@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>
            <div>
                <label class="text-xs text-amber-200/80 font-semibold tracking-wider uppercase">Senha (mínimo 6 caracteres)</label>
                <input type="password" id="auth-password" required placeholder="******" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>
            <div class="flex gap-3 pt-3">
                <button type="button" onclick="handleLogin()" class="flex-1 bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
                <button type="button" onclick="handleRegister()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-amber-200 font-semibold py-2.5 rounded-lg text-sm border border-amber-500/20 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Cadastrar
                </button>
            </div>
        </form>
        <div id="auth-error" class="text-xs text-red-400 text-center hidden bg-red-950/40 p-2.5 rounded border border-red-500/30"></div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="app-container" class="max-w-4xl mx-auto space-y-6 hidden">
        
        <!-- Cabeçalho com Backup & Logout -->
        <header class="flex flex-col sm:flex-row justify-between items-center bg-slate-900/80 backdrop-blur p-5 rounded-2xl border gold-border shadow-xl purple-glow gap-4">
            <div>
                <h1 class="text-2xl font-black text-amber-400 font-rpg tracking-widest flex items-center gap-3">
                    <i class="fa-solid fa-hat-wizard text-purple-400"></i> METAS NO AQW
                </h1>
                <p id="user-email-display" class="text-xs text-slate-400 mt-0.5 tracking-wide"></p>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap">
                <!-- Botões Backup JSON -->
                <button onclick="exportData()" title="Exportar Backup JSON" class="bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs px-3 py-2 rounded-xl border border-amber-500/20 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> Exportar
                </button>
                <label title="Importar Backup JSON" class="bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs px-3 py-2 rounded-xl border border-amber-500/20 transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-upload"></i> Importar
                    <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                </label>
                <button onclick="handleLogout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-3.5 py-2 rounded-xl border border-red-500/30 transition flex items-center gap-1.5 font-medium ml-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </header>

        <!-- DASHBOARD DE ESTATÍSTICAS + SERVER TIME RESET -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 text-center space-y-1">
                <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Metas Totais</p>
                <p id="stat-total-tasks" class="text-2xl font-black text-amber-400 font-rpg">0</p>
            </div>
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 text-center space-y-1">
                <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Hall da Fama (100%)</p>
                <p id="stat-completed-tasks" class="text-2xl font-black text-emerald-400 font-rpg">0</p>
            </div>
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 text-center space-y-1">
                <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Progresso Geral</p>
                <p id="stat-overall-progress" class="text-2xl font-black text-purple-400 font-rpg">0%</p>
            </div>
            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 text-center space-y-0.5 flex flex-col justify-center">
                <p class="text-[9px] text-amber-400 font-bold tracking-widest uppercase flex items-center justify-center gap-1">
                    <i class="fa-solid fa-clock"></i> AQW Server Reset
                </p>
                <p id="aqw-server-time" class="text-xs font-mono text-slate-300">00:00:00 EST</p>
                <p id="aqw-reset-timer" class="text-[10px] text-emerald-400 font-mono font-bold">in --:--:--</p>
            </div>
        </div>

        <!-- BARRA DE PESQUISA E FILTROS -->
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-800">
            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
                <input type="text" id="search-input" oninput="renderTasks()" placeholder="Buscar meta ou reagente..."
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition">
            </div>
            <div class="flex gap-1.5 w-full sm:w-auto justify-end flex-wrap">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn text-xs px-3 py-1.5 rounded-lg border font-medium transition bg-amber-500/20 text-amber-300 border-amber-500/40">Todas</button>
                <button onclick="setFilter('active')" id="filter-active" class="filter-btn text-xs px-3 py-1.5 rounded-lg border font-medium transition bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200">Em Progresso</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn text-xs px-3 py-1.5 rounded-lg border font-medium transition bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200">Hall da Fama</button>
            </div>
        </div>

        <!-- Formulário para Nova Meta + Botão de PRESETS -->
        <div class="bg-slate-900/90 p-4 rounded-2xl border gold-border shadow-lg space-y-3">
            <form id="task-form" class="flex gap-2">
                <input type="text" id="task-input" placeholder="Nova meta principal (ex: Void Highlord, Legion DoomKnight)..." required
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition shadow-inner">
                <button type="submit" class="bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow-lg active:scale-95 font-rpg tracking-wider">
                    <i class="fa-solid fa-plus"></i> Criar
                </button>
            </form>

            <!-- BARRA DE PRESETS RÁPIDOS -->
            <div class="flex items-center gap-2 pt-2 border-t border-slate-800/80">
                <span class="text-[11px] font-bold text-amber-400 font-rpg tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-bolt text-yellow-400"></i> Presets Prontos:
                </span>
                <div class="flex gap-2 flex-wrap">
                    <button type="button" onclick="loadPreset('vhl')" class="text-[11px] bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 hover:border-amber-500/40 transition">
                        Void Highlord (VHL)
                    </button>
                    <button type="button" onclick="loadPreset('ldk')" class="text-[11px] bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 hover:border-amber-500/40 transition">
                        Legion DoomKnight
                    </button>
                    <button type="button" onclick="loadPreset('nsod')" class="text-[11px] bg-slate-800 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 hover:border-amber-500/40 transition">
                        NSoD
                    </button>
                </div>
            </div>
        </div>

        <!-- Lista de Tarefas -->
        <main id="tasks-container" class="space-y-5 pb-10">
            <div class="text-center py-20 text-slate-600">
                <i class="fa-solid fa-spinner fa-spin text-4xl mb-4 text-amber-500"></i>
                <p class="font-rpg tracking-wider">Carregando o Grimório...</p>
            </div>
        </main>
    </div>

    <!-- Script da Aplicação (Módulo Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5JO0TndQiMREXKEMzXE3h3UuunRaVPPg",
            authDomain: "metas-aqw.firebaseapp.com",
            projectId: "metas-aqw",
            storageBucket: "metas-aqw.firebasestorage.app",
            messagingSenderId: "366374848500",
            appId: "1:366374848500:web:cd313a2b95e344bedddba1",
            measurementId: "G-W5DNRL8REZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let tasks = [];
        let currentFilter = 'all';

        // ⏱️ RELÓGIO DO SERVIDOR DO AQW (EST)
        function updateAQWServerTime() {
            const now = new Date();
            const estTimeStr = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: false });
            document.getElementById('aqw-server-time').innerText = `${estTimeStr} EST`;

            // Calcular tempo até o reset (00:00 EST)
            const estDateStr = now.toLocaleDateString('en-US', { timeZone: 'America/New_York' });
            const estNow = new Date(`${estDateStr} ${estTimeStr}`);
            const estReset = new Date(`${estDateStr} 24:00:00`);
            let diffMs = estReset - estNow;

            const hours = Math.floor(diffMs / (1000 * 60 * 60)).toString().padStart(2, '0');
            const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            const secs = Math.floor((diffMs % (1000 * 60)) / 1000).toString().padStart(2, '0');

            document.getElementById('aqw-reset-timer').innerText = `Reset em ${hours}:${mins}:${secs}`;
        }
        setInterval(updateAQWServerTime, 1000);
        updateAQWServerTime();

        onAuthStateChanged(auth, async (user) => {
            const authContainer = document.getElementById('auth-container');
            const appContainer = document.getElementById('app-container');
            const emailDisplay = document.getElementById('user-email-display');

            if (user) {
                currentUser = user;
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                emailDisplay.innerText = `Herói: ${user.email}`;
                await loadUserTasks();
            } else {
                currentUser = null;
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
                tasks = [];
                document.getElementById('tasks-container').innerHTML = '';
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            errDiv.classList.add('hidden');

            if (!email || !password) {
                errDiv.innerText = "Preencha e-mail e senha.";
                errDiv.classList.remove('hidden');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                console.error(err);
                errDiv.innerText = "Erro ao entrar: Verifique e-mail/senha ou cadastre-se.";
                errDiv.classList.remove('hidden');
            }
        };

        window.handleRegister = async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            errDiv.classList.add('hidden');

            if (!email || password.length < 6) {
                errDiv.innerText = "E-mail inválido ou senha com menos de 6 caracteres.";
                errDiv.classList.remove('hidden');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (err) {
                console.error(err);
                errDiv.innerText = "Erro ao cadastrar: Este e-mail já pode estar em uso.";
                errDiv.classList.remove('hidden');
            }
        };

        window.handleLogout = () => signOut(auth);

        async function loadUserTasks() {
            if (!currentUser) return;
            const container = document.getElementById('tasks-container');
            
            try {
                const docRef = doc(db, "users", currentUser.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    tasks = docSnap.data().tasks || [];
                } else {
                    tasks = [];
                    await setDoc(docRef, { tasks: [] });
                }
                renderTasks();
            } catch (err) {
                console.error("Erro ao carregar tarefas:", err);
                container.innerHTML = `<div class="text-center py-10 text-red-400">Erro ao carregar dados da nuvem. Tentando novamente...</div>`;
                setTimeout(loadUserTasks, 5000);
            }
        }

        async function saveAndRender() {
            renderTasks();
            if (!currentUser) return;
            try {
                const docRef = doc(db, "users", currentUser.uid);
                await setDoc(docRef, { tasks: tasks }, { merge: true });
            } catch (err) {
                console.error("Erro ao salvar na nuvem:", err);
            }
        }

        window.setFilter = function(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn text-xs px-3 py-1.5 rounded-lg border font-medium transition bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200";
            });
            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) activeBtn.className = "filter-btn text-xs px-3 py-1.5 rounded-lg border font-medium transition bg-amber-500/20 text-amber-300 border-amber-500/40";
            renderTasks();
        };

        // ✏️ EDITAR TÍTULO DA META PRINCIPAL
        window.editTaskTitle = function(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            const newTitle = prompt("Edite o título da meta principal:", task.title);
            if (newTitle !== null && newTitle.trim() !== "") {
                task.title = newTitle.trim();
                saveAndRender();
            }
        };

        // ✏️ EDITAR TÍTULO DA SUBQUEST
        window.editSubtaskTitle = function(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            const sub = task.subtasks.find(s => s.id === subtaskId);
            if (!sub) return;
            const newTitle = prompt("Edite o título da quest:", sub.title);
            if (newTitle !== null && newTitle.trim() !== "") {
                sub.title = newTitle.trim();
                saveAndRender();
            }
        };

        window.addTask = function(title) {
            tasks.push({ id: Date.now(), title, subtasks: [] });
            saveAndRender();
        };

        window.deleteTask = function(id) {
            if(confirm("Tem certeza que deseja excluir esta meta principal?")) {
                tasks = tasks.filter(t => t.id !== id);
                saveAndRender();
            }
        };

        window.addSubtask = function(taskId, title) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.subtasks.push({ id: Date.now(), title, items: [] });
                saveAndRender();
            }
        };

        window.deleteSubtask = function(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.subtasks = task.subtasks.filter(s => s.id !== subtaskId);
                saveAndRender();
            }
        };

        window.addItem = function(taskId, subtaskId, title, hasQuantity, currentQty, totalQty, isDaily = false) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(s => s.id === subtaskId);
                if (subtask) {
                    const completed = hasQuantity ? (currentQty >= totalQty) : false;
                    subtask.items.push({
                        id: Date.now(), title, hasQuantity, isDaily,
                        currentQty: hasQuantity ? currentQty : 0,
                        totalQty: hasQuantity ? totalQty : 1, completed
                    });
                    saveAndRender();
                }
            }
        };

        window.toggleItem = function(taskId, subtaskId, itemId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(s => s.id === subtaskId);
                if (subtask) {
                    const item = subtask.items.find(i => i.id === itemId);
                    if (item) {
                        item.completed = !item.completed;
                        if (item.hasQuantity) item.currentQty = item.completed ? item.totalQty : 0;
                        saveAndRender();
                    }
                }
            }
        };

        window.updateItemQuantity = function(taskId, subtaskId, itemId, newQty) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(s => s.id === subtaskId);
                if (subtask) {
                    const item = subtask.items.find(i => i.id === itemId);
                    if (item && item.hasQuantity) {
                        item.currentQty = Math.max(0, Math.min(newQty, item.totalQty));
                        item.completed = item.currentQty >= item.totalQty;
                        saveAndRender();
                    }
                }
            }
        };

        window.deleteItem = function(taskId, subtaskId, itemId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(s => s.id === subtaskId);
                if (subtask) {
                    subtask.items = subtask.items.filter(i => i.id !== itemId);
                    saveAndRender();
                }
            }
        };

        // 🧙 LOAD PRESETS FAMOSOS DE FARM
        window.loadPreset = function(presetType) {
            if (presetType === 'vhl') {
                tasks.push({
                    id: Date.now(),
                    title: "Void Highlord (VHL)",
                    subtasks: [
                        {
                            id: Date.now() + 1,
                            title: "Roentgenium of Nulgath (15x)",
                            items: [
                                { id: Date.now() + 10, title: "Roentgenium of Nulgath", hasQuantity: true, currentQty: 0, totalQty: 15, completed: false, isDaily: false },
                                { id: Date.now() + 11, title: "Elder's Blood (Daily Quest)", hasQuantity: true, currentQty: 0, totalQty: 15, completed: false, isDaily: true },
                                { id: Date.now() + 12, title: "Voucher of Nulgath (non-mem)", hasQuantity: true, currentQty: 0, totalQty: 1, completed: false, isDaily: false },
                                { id: Date.now() + 13, title: "Black Knight Orb", hasQuantity: true, currentQty: 0, totalQty: 15, completed: false, isDaily: false }
                            ]
                        },
                        {
                            id: Date.now() + 2,
                            title: "Requisitos de Desafiante",
                            items: [
                                { id: Date.now() + 20, title: "Void Crystal A", hasQuantity: true, currentQty: 0, totalQty: 1, completed: false, isDaily: false },
                                { id: Date.now() + 21, title: "Void Crystal B", hasQuantity: true, currentQty: 0, totalQty: 1, completed: false, isDaily: false }
                            ]
                        }
                    ]
                });
            } else if (presetType === 'ldk') {
                tasks.push({
                    id: Date.now(),
                    title: "Legion DoomKnight",
                    subtasks: [
                        {
                            id: Date.now() + 1,
                            title: "Requisitos Legion",
                            items: [
                                { id: Date.now() + 10, title: "Legion Token", hasQuantity: true, currentQty: 0, totalQty: 2000, completed: false, isDaily: false },
                                { id: Date.now() + 11, title: "Dark Token", hasQuantity: true, currentQty: 0, totalQty: 100, completed: false, isDaily: false }
                            ]
                        }
                    ]
                });
            } else if (presetType === 'nsod') {
                tasks.push({
                    id: Date.now(),
                    title: "Necrotic Sword of Doom (NSoD)",
                    subtasks: [
                        {
                            id: Date.now() + 1,
                            title: "Reagentes Principais",
                            items: [
                                { id: Date.now() + 10, title: "Void Aura", hasQuantity: true, currentQty: 0, totalQty: 7500, completed: false, isDaily: false },
                                { id: Date.now() + 11, title: "Cavern Celestite", hasQuantity: true, currentQty: 0, totalQty: 1600, completed: false, isDaily: false },
                                { id: Date.now() + 12, title: "Barium of MineCrafting (Daily)", hasQuantity: true, currentQty: 0, totalQty: 4, completed: false, isDaily: true }
                            ]
                        }
                    ]
                });
            }
            saveAndRender();
        };

        // 💾 EXPORTAR / IMPORTAR BACKUP JSON
        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `metas-aqw-backup-${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };

        window.importData = function(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const importedTasks = JSON.parse(e.target.result);
                    if (Array.isArray(importedTasks)) {
                        tasks = importedTasks;
                        saveAndRender();
                        alert("Backup de metas importado com sucesso!");
                    } else {
                        alert("Arquivo JSON inválido.");
                    }
                } catch(err) {
                    alert("Erro ao ler o arquivo JSON.");
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        };

        function getItemProgress(item) {
            if (!item.hasQuantity) return item.completed ? 100 : 0;
            if (item.totalQty <= 0) return 0;
            return Math.min(100, Math.round((item.currentQty / item.totalQty) * 100));
        }

        function getSubtaskProgress(subtask) {
            if (!subtask.items || subtask.items.length === 0) return 0;
            let totalPercent = 0;
            subtask.items.forEach(item => totalPercent += getItemProgress(item));
            return Math.round(totalPercent / subtask.items.length);
        }

        function getTaskProgress(task) {
            if (!task.subtasks || task.subtasks.length === 0) return 0;
            let totalPercent = 0;
            task.subtasks.forEach(sub => totalPercent += getSubtaskProgress(sub));
            return Math.round(totalPercent / task.subtasks.length);
        }

        function updateStats() {
            const totalTasks = tasks.length;
            let completedTasks = 0;
            let totalProgressSum = 0;

            tasks.forEach(task => {
                const prog = getTaskProgress(task);
                totalProgressSum += prog;
                if (prog === 100 && task.subtasks.length > 0) completedTasks++;
            });

            const overallProgress = totalTasks > 0 ? Math.round(totalProgressSum / totalTasks) : 0;

            document.getElementById('stat-total-tasks').innerText = totalTasks;
            document.getElementById('stat-completed-tasks').innerText = completedTasks;
            document.getElementById('stat-overall-progress').innerText = `${overallProgress}%`;
        }

        window.renderTasks = function() {
            updateStats();
            const container = document.getElementById('tasks-container');
            const searchQuery = (document.getElementById('search-input')?.value || '').toLowerCase();
            container.innerHTML = '';

            let filteredTasks = tasks.filter(task => {
                const matchesSearch = task.title.toLowerCase().includes(searchQuery) ||
                    task.subtasks.some(s => s.title.toLowerCase().includes(searchQuery) || 
                    s.items.some(i => i.title.toLowerCase().includes(searchQuery)));
                const prog = getTaskProgress(task);
                const isCompleted = prog === 100 && task.subtasks.length > 0;

                if (currentFilter === 'active') return matchesSearch && !isCompleted;
                if (currentFilter === 'completed') return matchesSearch && isCompleted;
                return matchesSearch;
            });

            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-slate-900/40 rounded-2xl border border-slate-800 border-dashed text-slate-500">
                        <i class="fa-solid fa-dragon text-5xl mb-3 text-slate-700"></i>
                        <p class="font-rpg tracking-wider text-slate-400">Nenhuma meta encontrada no Grimório.</p>
                    </div>`;
                return;
            }

            filteredTasks.forEach(task => {
                const mainProgress = getTaskProgress(task);
                const isMastered = mainProgress === 100 && task.subtasks.length > 0;
                const card = document.createElement('div');
                card.className = `bg-slate-900/90 rounded-2xl border ${isMastered ? 'border-amber-500/60 shadow-amber-500/10' : 'border-slate-800'} p-6 shadow-xl space-y-5 transition duration-300 transform hover:-translate-y-1 gold-glow`;

                card.innerHTML = `
                    <!-- Título da Meta Principal -->
                    <div class="flex items-center justify-between gap-3 border-b border-slate-800 pb-4">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-crown ${isMastered ? 'text-amber-400' : 'text-purple-400'} text-xl"></i>
                            <h2 class="font-extrabold text-xl font-rpg text-amber-100 tracking-wider flex items-center gap-2">
                                ${escapeHtml(task.title)}
                                <button onclick="editTaskTitle(${task.id})" class="text-slate-500 hover:text-amber-400 text-xs transition p-1" title="Editar Título">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                            </h2>
                            ${isMastered ? '<span class="bg-amber-500/20 text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded border border-amber-500/40 tracking-widest font-rpg">HALL DA FAMA</span>' : ''}
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-slate-600 hover:text-red-400 transition p-2 rounded-lg hover:bg-slate-800" title="Excluir meta">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>

                    <!-- Barra de Progresso Geral da Meta -->
                    <div class="space-y-1.5 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80 shadow-inner">
                        <div class="flex justify-between text-xs font-bold font-rpg tracking-widest">
                            <span class="text-slate-400">PROGRESSO GERAL</span>
                            <span class="${isMastered ? 'text-amber-400' : 'text-purple-400'}">${mainProgress}%</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-800 shadow-inner">
                            <div class="${isMastered ? 'bg-gradient-to-r from-amber-500 to-yellow-300' : 'bg-gradient-to-r from-purple-600 to-indigo-400'} h-3 rounded-full transition-all duration-500 ease-out" style="width: ${mainProgress}%"></div>
                        </div>
                    </div>

                    <!-- Lista de Quests -->
                    <div class="space-y-4 pt-1">
                        ${task.subtasks.map(sub => {
                            const subProgress = getSubtaskProgress(sub);
                            return `
                                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/90 space-y-3.5 shadow-inner">
                                    <div class="flex items-center justify-between border-b border-slate-800/60 pb-2.5">
                                        <span class="text-sm font-bold text-amber-200/90 flex items-center gap-2 font-rpg tracking-wide">
                                            <i class="fa-solid fa-scroll text-xs text-purple-400"></i>
                                            ${escapeHtml(sub.title)}
                                            <button onclick="editSubtaskTitle(${task.id}, ${sub.id})" class="text-slate-500 hover:text-amber-400 text-xs transition p-0.5" title="Editar Quest">
                                                <i class="fa-solid fa-pen-to-square"></i>
                                            </button>
                                        </span>
                                        <button onclick="deleteSubtask(${task.id}, ${sub.id})" class="text-slate-600 hover:text-red-400 transition text-xs p-1 rounded hover:bg-slate-800">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>

                                    <div class="space-y-1">
                                        <div class="flex justify-between text-[11px] text-slate-400 font-medium">
                                            <span>Progresso da Quest</span>
                                            <span class="text-emerald-400 font-bold">${subProgress}%</span>
                                        </div>
                                        <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                                            <div class="bg-gradient-to-r from-emerald-600 to-emerald-400 h-2 rounded-full transition-all duration-300" style="width: ${subProgress}%"></div>
                                        </div>
                                    </div>

                                    <!-- Lista de Itens -->
                                    <div class="space-y-2 pl-3 border-l-2 border-slate-800">
                                        ${sub.items.map(item => {
                                            const itemProg = getItemProgress(item);
                                            const wikiUrl = `https://aqwwiki.wikidot.com/search:main/q/${encodeURIComponent(item.title)}`;
                                            return `
                                                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 text-xs space-y-2 hover:border-slate-700 transition">
                                                    <div class="flex items-center justify-between gap-2">
                                                        <label class="flex items-center gap-2.5 cursor-pointer flex-1 select-none">
                                                            <input type="checkbox" ${item.completed ? 'checked' : ''} 
                                                                onchange="toggleItem(${task.id}, ${sub.id}, ${item.id})"
                                                                class="w-4 h-4 accent-amber-500 rounded cursor-pointer bg-slate-950 border-slate-700">
                                                            <span class="${item.completed ? 'line-through text-slate-500' : 'text-slate-200'} font-medium flex-1">
                                                                ${escapeHtml(item.title)}
                                                            </span>
                                                        </label>

                                                        <!-- BADGE DAILY -->
                                                        ${item.isDaily ? `
                                                            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1" title="Quest Diária">
                                                                <i class="fa-solid fa-calendar-day"></i> DAILY
                                                            </span>
                                                        ` : ''}

                                                        <!-- LINK AQW WIKI -->
                                                        <a href="${wikiUrl}" target="_blank" title="Buscar na AQW Wiki" class="text-slate-500 hover:text-amber-400 transition text-xs p-1">
                                                            <i class="fa-solid fa-book"></i>
                                                        </a>

                                                        ${item.hasQuantity ? `
                                                            <div class="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-md border border-slate-800 shadow-inner text-[11px]">
                                                                <input type="number" min="0" max="${item.totalQty}" value="${item.currentQty}"
                                                                    onchange="updateItemQuantity(${task.id}, ${sub.id}, ${item.id}, parseInt(this.value) || 0)"
                                                                    class="w-12 bg-transparent text-right text-emerald-400 font-bold focus:outline-none focus:text-white">
                                                                <span class="text-slate-600">/</span>
                                                                <span class="text-slate-400 font-medium">${item.totalQty}</span>
                                                            </div>
                                                        ` : ''}

                                                        <button onclick="deleteItem(${task.id}, ${sub.id}, ${item.id})" class="text-slate-600 hover:text-red-400 transition text-xs p-1 rounded hover:bg-slate-800">
                                                            <i class="fa-solid fa-trash-can text-[11px]"></i>
                                                        </button>
                                                    </div>

                                                    ${item.hasQuantity ? `
                                                        <div class="space-y-0.5 pt-1 border-t border-slate-800">
                                                            <div class="flex justify-end text-[10px] text-slate-400 font-medium">
                                                                <span>${itemProg}% (${item.currentQty}/${item.totalQty})</span>
                                                            </div>
                                                            <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden border border-slate-800">
                                                                <div class="bg-amber-500 h-1.5 rounded-full transition-all duration-300" style="width: ${itemProg}%"></div>
                                                            </div>
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>

                                    <!-- Formulário Novo Item -->
                                    <form onsubmit="handleItemSubmit(event, ${task.id}, ${sub.id})" class="bg-slate-900/60 p-3 rounded-lg border border-slate-800 space-y-2 mt-3">
                                        <div class="flex items-center justify-between gap-2 flex-wrap">
                                            <span class="text-[11px] font-bold text-amber-400 font-rpg tracking-wider">NOVO ITEM:</span>
                                            <div class="flex items-center gap-3">
                                                <label class="flex items-center gap-1.5 cursor-pointer text-[11px] text-slate-300 select-none bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                                    <input type="checkbox" class="daily-toggle accent-emerald-500 rounded w-3.5 h-3.5">
                                                    Daily?
                                                </label>
                                                <label class="flex items-center gap-1.5 cursor-pointer text-[11px] text-slate-300 select-none bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                                    <input type="checkbox" onchange="toggleQtyInputs(this)" class="qty-toggle accent-amber-500 rounded w-3.5 h-3.5">
                                                    Quantidade?
                                                </label>
                                            </div>
                                        </div>
                                        <div class="flex gap-2 items-center">
                                            <input type="text" placeholder="Nome do item (ex: Nulgath Approval)..." required class="item-title flex-1 bg-slate-950 border border-slate-800 rounded-md px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition">
                                            <div class="qty-container hidden flex items-center gap-1 bg-slate-950 p-1 rounded-md border border-slate-800">
                                                <input type="number" min="0" value="0" class="item-qty-current w-12 bg-slate-900 border border-slate-800 rounded px-1.5 py-1 text-xs text-center text-slate-100 focus:outline-none">
                                                <span class="text-slate-600 text-xs">/</span>
                                                <input type="number" min="1" value="10" class="item-qty-total w-12 bg-slate-900 border border-slate-800 rounded px-1.5 py-1 text-xs text-center text-slate-100 focus:outline-none">
                                            </div>
                                            <button type="submit" class="bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold px-3 py-1.5 rounded-md text-xs border border-amber-500/20 transition flex items-center gap-1">
                                                <i class="fa-solid fa-plus text-[10px]"></i> ADD
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Formulário Nova Quest -->
                    <form onsubmit="handleSubtaskSubmit(event, ${task.id})" class="flex gap-2 pt-2 border-t border-slate-800 mt-2">
                        <input type="text" placeholder="Nova quest (ex: Requisitos de Nulgath)..." required class="subtask-input flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition">
                        <button type="submit" class="bg-slate-800 hover:bg-slate-700 text-amber-200 font-semibold px-4 py-2 rounded-xl text-xs border border-amber-500/20 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-plus text-[10px]"></i> Quest
                        </button>
                    </form>
                `;
                container.appendChild(card);
            });
        };

        window.toggleQtyInputs = function(checkbox) {
            const form = checkbox.closest('form');
            form.querySelector('.qty-container').classList.toggle('hidden', !checkbox.checked);
        };

        window.handleItemSubmit = function(e, taskId, subtaskId) {
            e.preventDefault();
            const form = e.target;
            const title = form.querySelector('.item-title').value.trim();
            const hasQuantity = form.querySelector('.qty-toggle').checked;
            const isDaily = form.querySelector('.daily-toggle').checked;
            const currentQty = parseInt(form.querySelector('.item-qty-current').value) || 0;
            const totalQty = parseInt(form.querySelector('.item-qty-total').value) || 1;
            if (title) addItem(taskId, subtaskId, title, hasQuantity, currentQty, totalQty, isDaily);
            form.reset();
            form.querySelector('.qty-container').classList.add('hidden');
        };

        window.handleSubtaskSubmit = function(e, taskId) {
            e.preventDefault();
            const input = e.target.querySelector('.subtask-input');
            if (input.value.trim()) {
                addSubtask(taskId, input.value.trim());
                input.value = '';
            }
        };

        document.getElementById('task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('task-input');
            if (input.value.trim()) {
                addTask(input.value.trim());
                input.value = '';
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
        }
    </script>
</body>
</html>

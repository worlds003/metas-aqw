<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas AQW</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --text-muted: #aaaaaa;
      --accent-color: #bb86fc;
      --accent-hover: #3700b3;
      --border-color: #333333;
      --success-color: #03dac6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 5px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .meta-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .meta-title {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wiki-link {
      font-size: 0.9rem;
      color: var(--success-color);
      text-decoration: none;
    }

    .wiki-link:hover {
      text-decoration: underline;
    }

    .passo-box {
      background-color: rgba(255, 255, 255, 0.03);
      border-left: 4px solid var(--accent-color);
      padding: 12px;
      margin-top: 15px;
      border-radius: 4px;
    }

    .passo-titulo {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .passo-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    /* Lista de Requisitos e Cadeia */
    ul.requisitos-list {
      list-style: none;
      padding-left: 0;
      margin: 5px 0;
    }

    li.requisito-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
    }

    .requisito-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .req-info-principal {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-grow: 1;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease;
      padding: 0 4px;
    }

    .toggle-btn.ativo {
      transform: rotate(90deg);
    }

    .req-nome {
      font-weight: 500;
    }

    .req-qtd {
      font-family: monospace;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .req-detalhes {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
      padding-left: 24px;
      border-top: 1px dashed rgba(255, 255, 255, 0.05);
      padding-top: 4px;
    }

    /* Sub-requisitos (Cadeia) */
    .sub-requisitos {
      margin-top: 8px;
      padding-left: 20px;
      border-left: 2px solid var(--accent-color);
      display: none;
    }

    .sub-requisitos.mostrar {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Metas AQW</h1>
    <p>Acompanhe seu progresso de farms e classes</p>
  </header>

  <div class="container" id="metas-container">
    <!-- O conteúdo será injetado dinamicamente via JavaScript -->
  </div>

  <script>
    async function carregarMetas() {
      try {
        const resposta = await fetch('data/dados.json');
        const metas = await resposta.json();
        renderizarMetas(metas);
      } catch (erro) {
        console.error('Erro ao carregar o arquivo dados.json:', erro);
        document.getElementById('metas-container').innerHTML = '<p style="text-align: center; color: #ff6b6b;">Erro ao carregar os dados das metas.</p>';
      }
    }

    function criarArvoreRequisitos(requisitos) {
      if (!requisitos || requisitos.length === 0) return '';

      let html = '<ul class="requisitos-list">';
      requisitos.forEach(req => {
        const temFilhos = req.requisitos && req.requisitos.length > 0;
        
        html += `
          <li class="requisito-item">
            <div class="requisito-header">
              <div class="req-info-principal">
                ${temFilhos ? '<button class="toggle-btn" onclick="alternarSub(this)">▶</button>' : '<span style="width: 16px; display: inline-block;"></span>'}
                <span class="req-nome">${req.nome}</span>
              </div>
              <span class="req-qtd">${req.quantidadeAtual} / ${req.quantidadeTotal}</span>
            </div>
            
            ${(req.lugar || req.npc || req.quest) ? `
              <div class="req-detalhes">
                📍 <strong>Local:</strong> ${req.lugar || 'N/A'} | 
                👤 <strong>NPC:</strong> ${req.npc || 'N/A'} | 
                📜 <strong>Quest:</strong> ${req.quest || 'N/A'}
              </div>
            ` : ''}

            ${temFilhos ? `<div class="sub-requisitos">${criarArvoreRequisitos(req.requisitos)}</div>` : ''}
          </li>
        `;
      });
      html += '</ul>';
      return html;
    }

    function alternarSub(botao) {
      botao.classList.toggle('ativo');
      const itemPai = botao.closest('li');
      const subContainer = itemPai.querySelector('.sub-requisitos');
      if (subContainer) {
        subContainer.classList.toggle('mostrar');
      }
    }

    function renderizarMetas(metas) {
      const container = document.getElementById('metas-container');
      container.innerHTML = '';

      metas.forEach(meta => {
        let cardHTML = `
          <div class="meta-card">
            <div class="meta-title">
              <span>${meta.nome}</span>
              ${meta.wiki ? `<a href="${meta.wiki}" target="_blank" class="wiki-link">Wiki Oficial ↗</a>` : ''}
            </div>
        `;

        if (meta.passos && meta.passos.length > 0) {
          meta.passos.forEach(passo => {
            cardHTML += `
              <div class="passo-box">
                <div class="passo-titulo">${passo.titulo}</div>
                <div class="passo-desc">${passo.descricao}</div>
                ${criarArvoreRequisitos(passo.requisitos)}
              </div>
            `;
          });
        }

        cardHTML += `</div>`;
        container.innerHTML += cardHTML;
      });
    }

    // Inicializa o carregamento ao abrir a página
    carregarMetas();
  </script>
</body>
</html>

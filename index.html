<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAS NO AQW</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen py-10 px-4 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- TELA DE LOGIN / CADASTRO / CONVIDADO -->
    <div id="auth-container" class="max-w-md mx-auto bg-zinc-900 p-8 rounded-xl border border-zinc-800 shadow-2xl space-y-6 mt-12">
        <div class="text-center space-y-2 border-b border-zinc-800 pb-5">
            <h2 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-dragon text-indigo-400"></i> Metas AQW
            </h2>
            <p class="text-xs text-zinc-400">Gerenciador Avançado de Progresso</p>
        </div>

        <form id="auth-form" class="space-y-4" onsubmit="event.preventDefault();">
            <div>
                <label class="text-xs text-zinc-400 font-medium">E-mail</label>
                <input type="email" id="auth-email" placeholder="seu@email.com" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div>
                <label class="text-xs text-zinc-400 font-medium">Senha (mínimo 6 caracteres)</label>
                <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="button" onclick="handleLogin()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket text-xs"></i> Entrar
                </button>
                <button type="button" onclick="handleRegister()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-2.5 rounded-lg text-sm border border-zinc-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus text-xs"></i> Cadastrar
                </button>
            </div>
        </form>

        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-zinc-800"></div>
            <span class="flex-shrink mx-4 text-zinc-500 text-[10px] uppercase">ou</span>
            <div class="flex-grow border-t border-zinc-800"></div>
        </div>

        <button type="button" onclick="handleGuestLogin()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-medium py-2.5 rounded-lg text-sm border border-zinc-700 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-secret text-xs text-indigo-400"></i> Entrar como Convidado (Local)
        </button>

        <div id="auth-error" class="text-xs text-red-400 text-center hidden bg-red-950/30 p-2.5 rounded border border-red-900/50"></div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="app-container" class="max-w-4xl mx-auto space-y-6 hidden">

        <!-- Cabeçalho Principal -->
        <header class="flex flex-col sm:flex-row justify-between items-center bg-zinc-900 p-5 rounded-xl border border-zinc-800 shadow-md gap-4">
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight flex items-center gap-2.5">
                    <i class="fa-solid fa-dragon text-indigo-400"></i> METAS AQW
                </h1>
                <p id="user-email-display" class="text-xs text-zinc-400 mt-0.5"></p>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="resetDailies()" title="Resetar Dailies" class="bg-zinc-800 hover:bg-zinc-700 text-emerald-400 text-xs px-3 py-2 rounded-lg border border-zinc-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate"></i> Dailies
                </button>
                <button onclick="exportData()" title="Exportar Backup JSON" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-3 py-2 rounded-lg border border-zinc-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download text-zinc-400"></i> Exportar
                </button>
                <label title="Importar Backup JSON" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-3 py-2 rounded-lg border border-zinc-700 transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-upload text-zinc-400"></i> Importar
                    <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                </label>
                <button onclick="handleLogout()" class="bg-zinc-800 hover:bg-red-950/50 hover:text-red-400 text-zinc-400 text-xs px-3 py-2 rounded-lg border border-zinc-700 transition flex items-center gap-1.5 ml-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </header>

        <!-- DASHBOARD DE ESTATÍSTICAS + AQW RESET TIMER -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-center space-y-1">
                <p class="text-[10px] text-zinc-400 font-semibold uppercase tracking-wider">Metas Totais</p>
                <p id="stat-total-tasks" class="text-2xl font-bold text-white">0</p>
            </div>
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-center space-y-1">
                <p class="text-[10px] text-zinc-400 font-semibold uppercase tracking-wider">Concluídas</p>
                <p id="stat-completed-tasks" class="text-2xl font-bold text-emerald-400">0</p>
            </div>
            <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-center space-y-1">
                <p class="text-[10px] text-zinc-400 font-semibold uppercase tracking-wider">Progresso Geral</p>
                <p id="stat-overall-progress" class="text-2xl font-bold text-indigo-400">0%</p>
            </div>
            <div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800 text-center space-y-0.5 flex flex-col justify-center">
                <p class="text-[9px] text-zinc-400 font-semibold uppercase tracking-wider flex items-center justify-center gap-1">
                    <i class="fa-regular fa-clock text-indigo-400"></i> AQW Server Reset
                </p>
                <p id="aqw-server-time" class="text-xs font-mono text-zinc-300">00:00:00 EST</p>
                <p id="aqw-reset-timer" class="text-[10px] text-emerald-400 font-mono font-medium">in --:--:--</p>
            </div>
        </div>

        <!-- BUSCA E FILTROS -->
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between bg-zinc-900 p-3 rounded-xl border border-zinc-800">
            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-zinc-500"></i>
                <input type="text" id="search-input" oninput="renderTasks()" placeholder="Buscar meta ou item..."
                    class="w-full bg-zinc-950 border border-zinc-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div class="flex gap-1.5 w-full sm:w-auto justify-end">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn text-xs px-3 py-1.5 rounded-lg border font-medium transition bg-indigo-600/20 text-indigo-300 border-indigo-500/40">Todas</button>
                <button onclick="setFilter('active')" id="filter-active" class="filter-btn text-xs px-3 py-1.5 rounded-lg border font-medium transition bg-zinc-800 text-zinc-400 border-zinc-700 hover:text-zinc-200">Em Progresso</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn text-xs px-3 py-1.5 rounded-lg border font-medium transition bg-zinc-800 text-zinc-400 border-zinc-700 hover:text-zinc-200">Concluídas</button>
            </div>
        </div>

        <!-- Formulário para Nova Meta + Presets Rápidos -->
        <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 space-y-3">
            <form id="task-form" class="flex gap-2">
                <input type="text" id="task-input" placeholder="Nova meta principal (ex: Void Highlord, Lord of Order, Valiance)..." required
                    class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> Criar
                </button>
            </form>

            <div class="flex items-center gap-2 pt-2 border-t border-zinc-800">
                <span class="text-[11px] font-medium text-zinc-400 flex items-center gap-1">
                    <i class="fa-solid fa-bolt text-indigo-400"></i> Presets Rápidos:
                </span>
                <div class="flex gap-1.5 flex-wrap">
                    <button type="button" onclick="loadPreset('vhl')" class="text-[11px] bg-zinc-950 hover:bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded border border-zinc-800 transition">
                        Void Highlord (VHL)
                    </button>
                    <button type="button" onclick="loadPreset('loo')" class="text-[11px] bg-zinc-950 hover:bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded border border-zinc-800 transition">
                        Lord of Order
                    </button>
                    <button type="button" onclick="loadPreset('valiance')" class="text-[11px] bg-zinc-950 hover:bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded border border-zinc-800 transition">
                        Valiance
                    </button>
                    <button type="button" onclick="loadPreset('ldk')" class="text-[11px] bg-zinc-950 hover:bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded border border-zinc-800 transition">
                        Legion DoomKnight
                    </button>
                    <button type="button" onclick="loadPreset('nsod')" class="text-[11px] bg-zinc-950 hover:bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded border border-zinc-800 transition">
                        NSoD
                    </button>
                    <button type="button" onclick="loadPreset('vdk')" class="text-[11px] bg-zinc-950 hover:bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded border border-zinc-800 transition">
                        Verus DoomKnight
                    </button>
                </div>
            </div>
        </div>

        <!-- Lista de Metas Principal -->
        <main id="tasks-container" class="space-y-4 pb-10">
            <div class="text-center py-16 text-zinc-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-indigo-500"></i>
                <p class="text-sm">Carregando dados...</p>
            </div>
        </main>
    </div>

    <!-- Script Principal como Módulo -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAS NO AQW</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 font-sans">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- Cabeçalho -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-indigo-400 flex items-center justify-center gap-2">
                <i class="fa-solid fa-list-check"></i> METAS NO AQW
            </h1>
            <p class="text-slate-400 text-sm">Gerencie suas metas de itens, classes e requisitos do AQW.</p>
        </header>

        <!-- Formulário para Nova Meta Principal -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <form id="task-form" class="flex gap-2">
                <input type="text" id="task-input" placeholder="Nova meta principal (ex: Void Highlord)..." required
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                <button type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Adicionar Meta
                </button>
            </form>
        </div>

        <!-- Lista de Tarefas -->
        <main id="tasks-container" class="space-y-4">
            <!-- As tarefas serão inseridas dinamicamente via JS -->
        </main>
    </div>

    <!-- Script da Aplicação -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('metas_aqw_tasks_v2')) || [
            {
                id: 1,
                title: "Exemplo: Void Highlord",
                subtasks: [
                    {
                        id: 101,
                        title: "Roentgenium of Nulgath (15x)",
                        items: [
                            { id: 1001, title: "Black Knight Orb", completed: true },
                            { id: 1002, title: "Elemental Ink (10x)", completed: false }
                        ]
                    },
                    {
                        id: 102,
                        title: "Void Crystal A",
                        items: [
                            { id: 1003, title: "Unidentified 10 (200x)", completed: true }
                        ]
                    }
                ]
            }
        ];

        function saveAndRender() {
            localStorage.setItem('metas_aqw_tasks_v2', JSON.stringify(tasks));
            renderTasks();
        }

        // Funções para Meta Principal
        function addTask(title) {
            tasks.push({ id: Date.now(), title, subtasks: [] });
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        // Funções para Subtarefa
        function addSubtask(taskId, title) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.subtasks.push({ id: Date.now(), title, items: [] });
                saveAndRender();
            }
        }

        function deleteSubtask(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.subtasks = task.subtasks.filter(s => s.id !== subtaskId);
                saveAndRender();
            }
        }

        // Funções para Item / Sub-subtarefa
        function addItem(taskId, subtaskId, title) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(s => s.id === subtaskId);
                if (subtask) {
                    subtask.items.push({ id: Date.now(), title, completed: false });
                    saveAndRender();
                }
            }
        }

        function toggleItem(taskId, subtaskId, itemId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(s => s.id === subtaskId);
                if (subtask) {
                    const item = subtask.items.find(i => i.id === itemId);
                    if (item) {
                        item.completed = !item.completed;
                        saveAndRender();
                    }
                }
            }
        }

        function deleteItem(taskId, subtaskId, itemId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(s => s.id === subtaskId);
                if (subtask) {
                    subtask.items = subtask.items.filter(i => i.id !== itemId);
                    saveAndRender();
                }
            }
        }

        // Cálculos de Progresso
        function getSubtaskProgress(subtask) {
            if (!subtask.items || subtask.items.length === 0) return 0;
            const completed = subtask.items.filter(i => i.completed).length;
            return Math.round((completed / subtask.items.length) * 100);
        }

        function getTaskProgress(task) {
            if (!task.subtasks || task.subtasks.length === 0) return 0;
            let totalItems = 0;
            let completedItems = 0;

            task.subtasks.forEach(s => {
                s.items.forEach(i => {
                    totalItems++;
                    if (i.completed) completedItems++;
                });
            });

            if (totalItems === 0) return 0;
            return Math.round((completedItems / totalItems) * 100);
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-500">
                        <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
                        <p>Nenhuma meta cadastrada ainda.</p>
                    </div>
                `;
                return;
            }

            tasks.forEach(task => {
                const mainProgress = getTaskProgress(task);

                const card = document.createElement('div');
                card.className = "bg-slate-800 rounded-xl border border-slate-700 p-5 shadow-md space-y-4";

                card.innerHTML = `
                    <!-- Título da Meta Principal -->
                    <div class="flex items-center justify-between gap-2 border-b border-slate-700/60 pb-3">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-crosshairs text-indigo-400"></i>
                            <h2 class="font-semibold text-lg text-slate-100">${escapeHtml(task.title)}</h2>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-slate-500 hover:text-red-400 transition p-1" title="Excluir meta">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>

                    <!-- Barra de Progresso Geral da Meta -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs text-slate-400 font-medium">
                            <span>Progresso Total da Meta</span>
                            <span>${mainProgress}%</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-700/50">
                            <div class="bg-indigo-500 h-2.5 rounded-full transition-all duration-300" style="width: ${mainProgress}%"></div>
                        </div>
                    </div>

                    <!-- Subtarefas -->
                    <div class="space-y-3 pt-2">
                        ${task.subtasks.map(sub => {
                            const subProgress = getSubtaskProgress(sub);
                            const totalSubItems = sub.items.length;
                            const completedSubItems = sub.items.filter(i => i.completed).length;

                            return `
                                <div class="bg-slate-900/80 p-3.5 rounded-lg border border-slate-700/70 space-y-3">
                                    <!-- Título da Subtarefa + Botão Excluir -->
                                    <div class="flex items-center justify-between">
                                        <span class="text-sm font-medium text-slate-200 flex items-center gap-2">
                                            <i class="fa-solid fa-angle-right text-xs text-indigo-400"></i>
                                            ${escapeHtml(sub.title)}
                                        </span>
                                        <button onclick="deleteSubtask(${task.id}, ${sub.id})" class="text-slate-600 hover:text-red-400 transition text-xs p-1">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>

                                    <!-- Barra de Progresso da Subtarefa -->
                                    <div class="space-y-1">
                                        <div class="flex justify-between text-[11px] text-slate-400">
                                            <span>Progresso da Subtarefa</span>
                                            <span>${subProgress}% (${completedSubItems}/${totalSubItems})</span>
                                        </div>
                                        <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden">
                                            <div class="bg-emerald-500 h-1.5 rounded-full transition-all duration-300" style="width: ${subProgress}%"></div>
                                        </div>
                                    </div>

                                    <!-- Lista de Requisitos / Sub-subtarefas -->
                                    <div class="space-y-1.5 pl-2 border-l-2 border-slate-800">
                                        ${sub.items.map(item => `
                                            <div class="flex items-center justify-between bg-slate-800/50 px-2.5 py-1.5 rounded border border-slate-700/30 text-xs">
                                                <label class="flex items-center gap-2.5 cursor-pointer flex-1 select-none">
                                                    <input type="checkbox" ${item.completed ? 'checked' : ''} 
                                                        onchange="toggleItem(${task.id}, ${sub.id}, ${item.id})"
                                                        class="w-3.5 h-3.5 accent-emerald-500 rounded cursor-pointer">
                                                    <span class="${item.completed ? 'line-through text-slate-500' : 'text-slate-300'}">
                                                        ${escapeHtml(item.title)}
                                                    </span>
                                                </label>
                                                <button onclick="deleteItem(${task.id}, ${sub.id}, ${item.id})" class="text-slate-600 hover:text-red-400 transition text-[10px]">
                                                    <i class="fa-solid fa-xmark"></i>
                                                </button>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <!-- Formulário para adicionar item na subtarefa -->
                                    <form onsubmit="handleItemSubmit(event, ${task.id}, ${sub.id})" class="flex gap-2 pt-1">
                                        <input type="text" placeholder="Novo item / requisito..." required
                                            class="item-input flex-1 bg-slate-950 border border-slate-700/60 rounded px-2.5 py-1 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                                        <button type="submit" 
                                            class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded text-[11px] font-medium transition flex items-center gap-1 border border-slate-700">
                                            <i class="fa-solid fa-plus text-[9px]"></i> Item
                                        </button>
                                    </form>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Formulário para Nova Subtarefa -->
                    <form onsubmit="handleSubtaskSubmit(event, ${task.id})" class="flex gap-2 pt-2 border-t border-slate-700/60">
                        <input type="text" placeholder="Nova subtarefa (ex: Requisitos de Quest)..." required
                            class="subtask-input flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        <button type="submit" 
                            class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1">
                            <i class="fa-solid fa-plus text-[10px]"></i> Subtarefa
                        </button>
                    </form>
                `;

                container.appendChild(card);
            });
        }

        function handleSubtaskSubmit(e, taskId) {
            e.preventDefault();
            const input = e.target.querySelector('.subtask-input');
            if (input.value.trim()) {
                addSubtask(taskId, input.value.trim());
                input.value = '';
            }
        }

        function handleItemSubmit(e, taskId, subtaskId) {
            e.preventDefault();
            const input = e.target.querySelector('.item-input');
            if (input.value.trim()) {
                addItem(taskId, subtaskId, input.value.trim());
                input.value = '';
            }
        }

        document.getElementById('task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('task-input');
            if (input.value.trim()) {
                addTask(input.value.trim());
                input.value = '';
            }
        });

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[m]);
        }

        renderTasks();
    </script>
</body>
</html>

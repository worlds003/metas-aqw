<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAS NO AQW</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cinzel para estilo RPG/Fantasy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        .font-rpg { font-family: 'Cinzel', serif; }
        .gold-border { border-color: rgba(234, 179, 8, 0.4); }
        .gold-glow:hover { box-shadow: 0 0 15px rgba(234, 179, 8, 0.25); }
        .purple-glow { box-shadow: 0 0 20px rgba(147, 51, 234, 0.15); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4 font-sans selection:bg-amber-500 selection:text-slate-950">

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-container" class="max-w-md mx-auto bg-slate-900/90 backdrop-blur p-8 rounded-2xl border gold-border shadow-2xl space-y-6 pt-16 mt-10">
        <h2 class="text-3xl font-extrabold text-center text-amber-400 font-rpg tracking-wider flex items-center justify-center gap-3">
            <i class="fa-solid fa-dragon text-amber-500"></i> METAS NO AQW
        </h2>
        <p class="text-xs text-slate-400 text-center uppercase tracking-widest border-b border-slate-800 pb-4">Acesse seu Grimório de Metas</p>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="text-xs text-amber-200/80 font-semibold tracking-wider uppercase">E-mail</label>
                <input type="email" id="auth-email" required placeholder="seu@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-500 transition">
            </div>
            <div>
                <label class="text-xs text-amber-200/80 font-semibold tracking-wider uppercase">Senha</label>
                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-500 transition">
            </div>
            
            <button type="submit" id="auth-submit-btn" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-lg transition font-rpg tracking-wider text-base shadow-lg">
                Entrar
            </button>
        </form>

        <div class="text-center pt-2">
            <button id="toggle-auth-mode" class="text-xs text-slate-400 hover:text-amber-400 underline transition">
                Não tem uma conta? Cadastre-se
            </button>
        </div>
    </div>

</body>
</html>

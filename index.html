<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAS NO AQW</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 font-sans">

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-container" class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-4 pt-20">
        <h2 class="text-3xl font-bold text-center text-indigo-400 flex items-center justify-center gap-3">
            <i class="fa-solid fa-user-shield"></i> METAS NO AQW
        </h2>
        <p class="text-sm text-slate-400 text-center pb-4">Faça login ou cadastre-se para salvar suas metas na nuvem e acessar de qualquer lugar.</p>
        
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="text-xs text-slate-300 font-medium">E-mail</label>
                <input type="email" id="auth-email" required placeholder="seu@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="text-xs text-slate-300 font-medium">Senha (mínimo 6 caracteres)</label>
                <input type="password" id="auth-password" required placeholder="******" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            
            <div class="flex gap-3 pt-3">
                <button type="button" onclick="handleLogin()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
                <button type="button" onclick="handleSignup()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 rounded-lg text-sm transition border border-slate-600 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Criar Conta
                </button>
            </div>
        </form>
    </div>

    <!-- TELA PRINCIPAL (APLICAÇÃO) -->
    <div id="app-container" class="max-w-4xl mx-auto space-y-8 hidden">
        
        <!-- HEADER COM BOTÃO DE LOGOUT -->
        <div class="flex items-center justify-between bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 backdrop-blur-md">
            <div>
                <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                    <i class="fa-solid fa-crosshairs"></i> Minhas Metas AQW
                </h1>
                <p id="user-email-display" class="text-xs text-slate-400">Carregando usuário...</p>
            </div>
            <button onclick="handleLogout()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 font-medium">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
            </button>
        </div>

        <!-- FORMULÁRIO DE CRIAR META -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-indigo-400"></i> Criar Nova Meta
            </h2>
            
            <form id="goal-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Título da Meta</label>
                    <input type="text" id="goal-title" required placeholder="Ex: Farmar Void Highlord, VSK, NSoD..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Requisitos / Itens para Farmar</label>
                    <div id="requirements-container" class="space-y-2">
                        <!-- Campos dinâmicos entram aqui -->
                    </div>
                    <button type="button" onclick="addRequirementField()" class="mt-2 text-xs bg-slate-700 hover:bg-slate-600 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-lg transition flex items-center gap-1 font-medium">
                        <i class="fa-solid fa-plus"></i> Adicionar Item
                    </button>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Meta
                </button>
            </form>
        </div>

        <!-- LISTA DE METAS -->
        <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-indigo-400"></i> Metas Cadastradas
            </h2>
            <div id="goals-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Cards de Metas são renderizados aqui -->
            </div>
        </div>

    </div>

    <!-- SDK do Firebase via CDN (Módulos JS) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            doc, 
            updateDoc, 
            deleteDoc, 
            query, 
            where, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD-EXEMPLO-COPIE-SUA-CHAVE-AQUI",
            authDomain: "metas-aqw.firebaseapp.com",
            projectId: "metas-aqw",
            storageBucket: "metas-aqw.firebasestorage.app",
            messagingSenderId: "1837000-EXEMPLO",
            appId: "1:1837000:web:MWE4MzcwMGUtZDdkMi00MWI4LThiZmUtNDMwMTM4ODcyZmU4"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Monitor de Estado de Autenticação
        onAuthStateChanged(auth, (user) => {
            const authContainer = document.getElementById('auth-container');
            const appContainer = document.getElementById('app-container');
            const userEmailDisplay = document.getElementById('user-email-display');

            if (user) {
                currentUser = user;
                userEmailDisplay.innerText = `Conectado como: ${user.email}`;
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                loadGoals();
            } else {
                currentUser = null;
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        });

        // Funções de Autenticação
        window.handleLogin = async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return alert("Preencha todos os campos!");

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Erro ao entrar: " + error.message);
            }
        };

        window.handleSignup = async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return alert("Preencha todos os campos!");

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Conta criada com sucesso!");
            } catch (error) {
                alert("Erro ao cadastrar: " + error.message);
            }
        };

        window.handleLogout = () => {
            signOut(auth);
        };

        // Gerenciamento dos Campos Dinâmicos do Form
        window.addRequirementField = (name = "", req = 1, current = 0) => {
            const container = document.getElementById('requirements-container');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-slate-900/50 p-2 rounded-lg border border-slate-700/50";
            div.innerHTML = `
                <input type="text" placeholder="Nome do Item (Ex: Roentgenium)" value="${name}" required class="req-name flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100">
                <input type="number" placeholder="Atual" value="${current}" min="0" required class="req-current w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100">
                <span class="text-xs text-slate-500">/</span>
                <input type="number" placeholder="Meta" value="${req}" min="1" required class="req-target w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 p-1 text-xs">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        };

        // Adiciona um campo padrão ao carregar a página
        addRequirementField();

        // Salvar Meta no Firestore
        document.getElementById('goal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const title = document.getElementById('goal-title').value;
            const reqEntries = document.querySelectorAll('#requirements-container > div');
            
            const requirements = [];
            reqEntries.forEach(entry => {
                const name = entry.querySelector('.req-name').value;
                const current = parseInt(entry.querySelector('.req-current').value) || 0;
                const target = parseInt(entry.querySelector('.req-target').value) || 1;
                requirements.push({ name, current, target });
            });

            if (requirements.length === 0) {
                return alert("Adicione pelo menos um item para farmar!");
            }

            try {
                await addDoc(collection(db, "goals"), {
                    userId: currentUser.uid,
                    title,
                    requirements,
                    createdAt: serverTimestamp()
                });

                document.getElementById('goal-form').reset();
                document.getElementById('requirements-container').innerHTML = '';
                addRequirementField();
                loadGoals();
            } catch (error) {
                alert("Erro ao salvar meta: " + error.message);
            }
        });

        // Carregar e Renderizar Metas
        async function loadGoals() {
            if (!currentUser) return;
            
            const goalsList = document.getElementById('goals-list');
            goalsList.innerHTML = `<p class="text-sm text-slate-400 col-span-2">Carregando metas...</p>`;

            try {
                const q = query(collection(db, "goals"), where("userId", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);

                goalsList.innerHTML = '';

                if (querySnapshot.empty) {
                    goalsList.innerHTML = `<p class="text-sm text-slate-500 col-span-2">Nenhuma meta criada ainda.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const goal = docSnap.data();
                    const goalId = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-3 flex flex-col justify-between";

                    let reqsHtml = '';
                    goal.requirements.forEach((req, index) => {
                        const percent = Math.min(100, Math.round((req.current / req.target) * 100));
                        reqsHtml += `
                            <div class="space-y-1">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="font-medium text-slate-300">${req.name}</span>
                                    <div class="flex items-center gap-1">
                                        <input type="number" value="${req.current}" min="0" max="${req.target}" 
                                            onchange="updateProgress('${goalId}', ${index}, this.value)"
                                            class="w-14 bg-slate-900 border border-slate-700 text-center rounded px-1 py-0.5 text-xs text-indigo-300 font-bold focus:outline-none focus:border-indigo-500">
                                        <span class="text-slate-500">/ ${req.target}</span>
                                    </div>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-700/50">
                                    <div class="bg-indigo-500 h-2 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
                                </div>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between pb-2 border-b border-slate-700/50 mb-3">
                                <h3 class="font-bold text-slate-100 flex items-center gap-2">
                                    <span>${goal.title}</span>
                                    <button onclick="editarTitulo('${goalId}', '${goal.title.replace(/'/g, "\\'")}')" class="text-xs text-slate-400 hover:text-indigo-400 transition p-1" title="Editar título">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                </h3>
                                <button onclick="deleteGoal('${goalId}')" class="text-xs text-slate-500 hover:text-red-400 transition p-1">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                            <div class="space-y-3">
                                ${reqsHtml}
                            </div>
                        </div>
                    `;

                    goalsList.appendChild(card);
                });

            } catch (error) {
                console.error("Erro ao carregar metas:", error);
                goalsList.innerHTML = `<p class="text-sm text-red-400 col-span-2">Erro ao carregar metas.</p>`;
            }
        }

        // Função para Editar o Título da Meta
        window.editarTitulo = async (goalId, currentTitle) => {
            const newTitle = prompt("Edite o título da sua meta:", currentTitle);
            
            if (newTitle === null || newTitle.trim() === "") return;
            if (newTitle.trim() === currentTitle) return;

            try {
                const goalRef = doc(db, "goals", goalId);
                await updateDoc(goalRef, {
                    title: newTitle.trim()
                });
                loadGoals();
            } catch (error) {
                alert("Erro ao editar o título: " + error.message);
            }
        };

        // Atualizar Progresso de Item Específico
        window.updateProgress = async (goalId, reqIndex, newValue) => {
            const val = parseInt(newValue);
            if (isNaN(val) || val < 0) return;

            try {
                const goalRef = doc(db, "goals", goalId);
                const qSnap = await getDocs(query(collection(db, "goals"), where("__name__", "==", goalId)));
                
                if (!qSnap.empty) {
                    const goalData = qSnap.docs[0].data();
                    goalData.requirements[reqIndex].current = val;
                    
                    await updateDoc(goalRef, {
                        requirements: goalData.requirements
                    });
                    loadGoals();
                }
            } catch (error) {
                alert("Erro ao atualizar progresso: " + error.message);
            }
        };

        // Excluir Meta
        window.deleteGoal = async (goalId) => {
            if (!confirm("Tem certeza que deseja apagar esta meta?")) return;

            try {
                await deleteDoc(doc(db, "goals", goalId));
                loadGoals();
            } catch (error) {
                alert("Erro ao deletar: " + error.message);
            }
        };
    </script>
</body>
</html>
